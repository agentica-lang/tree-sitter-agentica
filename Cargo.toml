[package]
name = "tree-sitter-agentica"
description = "Agentica grammar for tree-sitter"
version = "0.2.0"
authors = ["Johanderson Mogollón <johander1822@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "agentica"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/sonic182/tree-sitter-agentica"
edition = "2021"
autoexamples = false
build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.25"
