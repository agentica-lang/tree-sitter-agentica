name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npx tree-sitter generate
      - run: git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json
      - run: npx tree-sitter test
      - run: npx tree-sitter parse test/fixtures/ci-smoke.agc
      - run: script/check-comment-run.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo test

  corpus:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: agentica-lang/agentica
          ref: 020f0f657fa9f51cc3cd90257779200485ae3d18 # 0.33.0
          path: agentica

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run parse-corpus -- agentica
